<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daymate 로그인</title><link rel="stylesheet" href="/static/style.css"></head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh">
<div class="card" style="max-width:360px;width:100%">
  <h2 id="ttl" style="margin-bottom:4px">📅 Daymate</h2>
  <p style="font-size:1.05rem;font-weight:600;color:var(--text);margin:0 0 6px;line-height:1.4">
    10초면 오늘 하루가 자동으로 짜여요.</p>
  <ul style="list-style:none;padding:0;margin:0 0 14px;font-size:.82rem;color:var(--muted);line-height:1.7">
    <li>✓ 30분 단위로 하루를 자동 설계</li>
    <li>✓ 컨디션에 맞춰 강도 조절</li>
    <li>✓ 일정이 틀어지면 지금부터 다시 짜기</li>
  </ul>
  <p class="hint" id="msg">이메일만 있으면 바로 시작해요.</p>
  <input id="email" type="email" placeholder="이메일" style="width:100%;margin-bottom:8px">
  <input id="pw" type="password" placeholder="비밀번호(6자+)" style="width:100%;margin-bottom:10px">
  <button id="regBtn" style="width:100%;margin-bottom:8px;font-size:1rem;padding:12px">시작하기 — 무료 가입</button>
  <div class="row"><button id="loginBtn" class="ghost" style="flex:1">이미 계정이 있어요 · 로그인</button></div>
  <p class="hint" style="margin-top:12px;text-align:center;font-size:.8rem">
    <a href="/privacy.html" style="opacity:.7">개인정보 처리방침</a></p>
</div>
<script>
// 초대 추적: ?ref=<inviter> 를 첫 방문 때 저장(가입 때 1회 전송).
try{const rf=new URLSearchParams(location.search).get("ref");
  if(rf&&!localStorage.getItem("daymate_ref"))localStorage.setItem("daymate_ref",rf.slice(0,40));}catch(e){}
async function post(p,extra){const body={email:email.value.trim(),password:pw.value};
  if(extra)Object.assign(body,extra);
  const r=await fetch(p,{method:"POST",headers:{"Content-Type":"application/json"},
  body:JSON.stringify(body)});return r;}
function go(){location.href="/";}
loginBtn.onclick=async()=>{const r=await post("/api/login");if(r.ok)go();else msg.textContent=(await r.json()).error;};
regBtn.onclick=async()=>{let ref=null;try{ref=localStorage.getItem("daymate_ref");}catch(e){}
  const r=await post("/api/register",ref?{ref:ref}:null);if(r.ok)go();else msg.textContent=(await r.json()).error;};
</script></body></html>
